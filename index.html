<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="main-container">

        <div class="bg-circle"></div>

        <div class="calculator-wrapper mx-auto">
            
            <div class="toggle-container justify-content-center mb-4">
                <input type="checkbox" id="theme-toggle" class="toggle-checkbox">
                <label for="theme-toggle" class="toggle-label">
                    <i class="fa-solid fa-sun toggle-icon sun"></i>
                    <i class="fa-solid fa-moon toggle-icon moon"></i>
                    <div class="toggle-ball"></div>
                </label>
            </div>

            <div class="calculator calc-light" id="main-calculator">
                
                <div class="display-area text-end">
                    <div class="history-text" id="history-display">600/2 +44</div>
                    <div class="result-text" id="result-display"> 4fjd</div>
                </div>

                <div class="buttons-grid">
                    <button class="btn-calc btn-special" data-action="top">Ac</button>
                    <button class="btn-calc btn-special" data-action="top">+_</button>
                    <button class="btn-calc btn-special" data-action="top">%</button>
                    <button class="btn-calc btn-special" data-action="top">%_</button>

                    <button class="btn-calc" data-action="ac">Ac</button>
                    <button class="btn-calc" data-num="8">8</button>
                    <button class="btn-calc" data-num="9">98</button>
                    <button class="btn-calc btn-top" data-op="÷">÷</button>

                    <button class="btn-calc" data-num="4">4</button>
                    <button class="btn-calc" data-num="5">5</button>
                    <button class="btn-calc" data-num="6">6</button>
                    <button class="btn-calc btn-top" data-op="÷">*</button>
                
                    <button class="btn-calc" data-num="1">1</button>
                    <button class="btn-calc" data-num="2">2</button>
                    <button class="btn-calc" data-num="3">3</button>
                    <button class="btn-calc btn-top" data-op="+">+</button>

                    <button class="btn-calc" data-num="0">0</button>
                    <button class="btn-calc" data-num=".">.</button>
                    <button class="btn-calc btn-special">DEL</button>

                    <button class="btn-calc btn-tall-blue" data-action="=">=</button>


                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
